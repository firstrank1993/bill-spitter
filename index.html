<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Split Bill App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 45%;
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      background: #38bdf8;
      cursor: pointer;
    }

    .friend {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      background: #334155;
      padding: 8px;
      border-radius: 6px;
    }

    .result {
      margin-top: 20px;
      background: #020617;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>💸 Split Bill</h1>

  <input id="name" placeholder="Friend Name">
  <input id="amount" type="number" placeholder="Amount Paid">
  <button onclick="addFriend()">Add</button>

  <div id="list"></div>

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="result"></div>
</div>

<script>
  let friends = [];

  function addFriend() {
    const name = document.getElementById("name").value;
    const amount = parseFloat(document.getElementById("amount").value);

    if (!name || isNaN(amount)) {
      alert("Enter valid details");
      return;
    }

    friends.push({ name, amount });
    render();

    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    friends.forEach(f => {
      list.innerHTML += `
        <div class="friend">
          <span>${f.name}</span>
          <span>₹${f.amount}</span>
        </div>
      `;
    });
  }

  function calculate() {
    let total = friends.reduce((sum, f) => sum + f.amount, 0);
    let avg = total / friends.length;

    let result = "";

    let debtors = [];
    let creditors = [];

    friends.forEach(f => {
      let diff = f.amount - avg;

      if (diff < 0) {
        debtors.push({ name: f.name, amount: -diff });
      } else {
        creditors.push({ name: f.name, amount: diff });
      }
    });

    debtors.forEach(d => {
      creditors.forEach(c => {
        if (d.amount > 0 && c.amount > 0) {
          let pay = Math.min(d.amount, c.amount);

          result += `${d.name} pays ₹${pay.toFixed(2)} to ${c.name}<br>`;

          d.amount -= pay;
          c.amount -= pay;
        }
      });
    });

    document.getElementById("result").innerHTML = result || "All settled!";
  }
</script>

</body>
</html>
